<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AD Omniserve</title>
<meta name="description" content="Persoonlijke app van Austin: sport, beleggen en agenda">
<meta name="theme-color" content="#0E1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AD Omniserve">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest?v=omni1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0E1116;--card:#171B22;--ink:#ECEFF3;--mut:#8C96A3;--line:#252B34;--met:#1F242C;--met2:#2E3540;
  --acc:#5FC4A0;--acc2:#16302A;--onacc:#0E1116;--work:#6E93F0;--work2:#1B2540;--priv:#B98AE6;--priv2:#2A1F38;
  --sport:#F08A55;--sport2:#3A2318;--warn:#F28B6B;--warn2:#3A1E17;--gold:#E8C46A;--gold2:#3A3218;--tab:rgba(14,17,22,.92);color-scheme:dark}
html.licht{--bg:#F3F4F6;--card:#FFFFFF;--ink:#14181F;--mut:#5F6B7A;--line:#E3E6EA;--met:#F0F2F5;--met2:#E2E6EB;
  --acc:#1E8F6A;--acc2:#DDF3EA;--onacc:#FFFFFF;--work:#3559C7;--work2:#E3EAFB;--priv:#7D46B8;--priv2:#F0E6FA;
  --sport:#C5571F;--sport2:#FBE7DC;--warn:#B8442A;--warn2:#FBE4DE;--gold:#8A6A12;--gold2:#F7EED3;--tab:rgba(255,255,255,.94);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 100px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.brand{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.av{width:34px;height:34px;border-radius:50%;background:var(--met2);display:grid;place-items:center;font-weight:600;font-size:14px;border:0;cursor:pointer}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
.sub{color:var(--mut);font-size:15px;margin-bottom:18px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:10px}
.ch h2{font-size:17px;font-weight:650}
.ch a,.lnk{font-size:14px;color:var(--acc);text-decoration:none;font-weight:500;background:none;border:0;cursor:pointer}
.mut{color:var(--mut)}.sm{font-size:13px}.src{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.4}
p{line-height:1.5}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.t-s{background:var(--sport2);color:var(--sport)}.t-w{background:var(--work2);color:var(--work)}.t-p{background:var(--priv2);color:var(--priv)}.t-a{background:var(--acc2);color:var(--acc)}.t-g{background:var(--gold2);color:var(--gold)}
.alert{border-radius:14px;padding:11px 12px;font-size:14px;margin-bottom:10px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.alert b{font-weight:650}.a-warn{background:var(--warn2);color:var(--warn)}.a-ok{background:var(--acc2);color:var(--acc)}.a-gold{background:var(--gold2);color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.met{background:var(--met);border-radius:14px;padding:12px}.met .l{font-size:12px;color:var(--mut)}
.met .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}.met .v small{font-size:13px;font-weight:500;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-child{border-top:0;padding-top:2px}.row>span{color:var(--mut)}.row b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
button.row{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;text-align:center;background:var(--acc);color:var(--onacc);font-weight:650;font-size:15px;padding:13px;border-radius:14px;border:0;cursor:pointer;margin-top:12px}
.btn:disabled{opacity:.5}.btn2{background:var(--met);color:var(--ink)}
.seg{display:flex;background:var(--met);border-radius:12px;padding:3px}
.seg button{flex:1;text-align:center;padding:8px 4px;font-size:14px;font-weight:600;color:var(--mut);border-radius:10px;border:0;background:none;cursor:pointer}
.seg .on{background:var(--met2);color:var(--ink)}
.week{display:flex;justify-content:space-between;margin-bottom:12px;gap:4px}
.wd{flex:1;text-align:center;padding:6px 0;border-radius:12px;font-size:12px;color:var(--mut);border:0;background:none;cursor:pointer}
.wd b{display:block;font-size:17px;color:var(--ink);margin-top:2px}.wd.on{background:var(--acc);color:var(--onacc)}.wd.on b{color:var(--onacc)}
.wd i{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:transparent}
.ev{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.ev:first-of-type,.ch+.ev{border-top:0;padding-top:0}
.ev .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:18px}
.ev .et{flex:1;min-width:0}.ev .et b{font-size:15px;font-weight:600;display:block}.ev .et span{font-size:13px;color:var(--mut);display:block;margin-top:2px;white-space:pre-line}
button.ev{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.chev{color:var(--mut);align-self:center}
.ana p{font-size:15px;line-height:1.55;margin-bottom:10px}
.spark{width:100%;height:84px;display:block}
.empty{color:var(--mut);font-size:14px;line-height:1.5}
.ask{display:flex;gap:8px;align-items:center;background:var(--met);border-radius:16px;padding:6px 6px 6px 14px;cursor:text}
.ask input{flex:1;border:0;background:none;outline:none;font-size:16px;padding:8px 0;min-width:0}
.ask button{border:0;background:var(--acc);color:var(--onacc);border-radius:12px;width:40px;height:40px;font-weight:700;cursor:pointer;flex:none}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sugg button{border:0;background:var(--met);color:var(--ink);font-size:13px;padding:7px 11px;border-radius:99px;cursor:pointer}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--tab);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);z-index:20}
.tabbar a{flex:1;max-width:112px;text-align:center;font-size:11px;font-weight:500;color:var(--mut);text-decoration:none}
.tabbar svg{width:24px;height:24px;display:block;margin:0 auto 3px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--acc)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;border-bottom:1px solid var(--line)}
.sheet header b{font-size:17px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;padding:10px 13px;border-radius:18px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.bub.u{align-self:flex-end;background:var(--acc);color:var(--onacc);border-bottom-right-radius:6px}
.bub.a{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.bub.e{align-self:center;background:var(--warn2);color:var(--warn);font-size:14px}
.sheet footer{padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--line)}
.q{margin-bottom:18px}.q h3{font-size:16px;font-weight:650;margin-bottom:8px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;background:var(--met);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;margin-top:6px;font-size:15px;cursor:pointer}
.opt.on{border-color:var(--acc);background:var(--acc2)}
.field{display:block;margin-top:10px}.field span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.field input{width:100%;background:var(--met);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;outline:none}
.field input:focus{border-color:var(--acc)}
.msg{font-size:14px;color:var(--mut);margin-top:10px;min-height:1em;line-height:1.4}
.login{max-width:400px;margin:8vh auto 0}
.logo{width:56px;height:56px;border-radius:16px;background:var(--acc2);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:20px;margin-bottom:16px;letter-spacing:-.03em}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:8px;background:var(--met);border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"><p class="mut" style="margin-top:30vh;text-align:center"><span class="spin"></span></p></div>
<nav class="tabbar hide" id="tabbar"></nav>
<div id="sheet"></div>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
"use strict";
/* ================= basis ================= */
const CFG = window.TD_CONFIG || {};
const sb = window.supabase && CFG.url && CFG.key ? supabase.createClient(CFG.url, CFG.key) : null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem("omni." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("omni." + k, JSON.stringify(v)); } catch (e) { /* privévenster */ } } };
const pad = (n) => String(n).padStart(2, "0");
const isoDag = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const vandaag = () => isoDag(new Date());
const plusDag = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return isoDag(d); };
const maandagVan = (iso) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoDag(d); };
const DAGEN = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"];
const MAANDEN = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
const langeDatum = (iso) => { const d = new Date(iso + "T12:00:00"); return DAGEN[d.getDay()] + " " + d.getDate() + " " + MAANDEN[d.getMonth()]; };
const korteDatum = (iso) => { const d = new Date(iso + "T12:00:00"); return d.getDate() + " " + MAANDEN[d.getMonth()].slice(0, 3); };
const getal = (x, dec = 0) => Number(x).toLocaleString("nl-BE", { minimumFractionDigits: dec, maximumFractionDigits: dec });
const euro = (x) => "€ " + Number(x).toLocaleString("nl-BE", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const duur = (sec) => { const m = Math.round(sec / 60); return m >= 60 ? Math.floor(m / 60) + "u" + pad(m % 60) : m + " min"; };
const sinds = (ts) => { if (!ts) return "nog nooit"; const m = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
  if (m < 2) return "net nu"; if (m < 60) return m + " min geleden"; const u = Math.round(m / 60); if (u < 24) return u + " uur geleden";
  const d = Math.round(u / 24); return d === 1 ? "gisteren" : d + " dagen geleden"; };

/* ================= thema ================= */
function zetThema() {
  const t = store.get("thema", "donker");
  const licht = t === "licht" || (t === "systeem" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
  document.documentElement.classList.toggle("licht", licht);
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = licht ? "#F3F4F6" : "#0E1116";
}
zetThema();
if (window.matchMedia) matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", zetThema);

/* ================= sporten ================= */
const SPORT = {
  lopen: { n: "Lopen", e: "🏃", c: "t-s" }, fietsen: { n: "Fietsen", e: "🚴", c: "t-w" }, zwemmen: { n: "Zwemmen", e: "🏊", c: "t-a" },
  kracht: { n: "Kracht", e: "💪", c: "t-p" }, wandelen: { n: "Wandelen", e: "🥾", c: "t-g" }, squash: { n: "Squash", e: "🎾", c: "t-p" },
  rust: { n: "Rust", e: "🌙", c: "t-g" }, andere: { n: "Andere", e: "⏱️", c: "t-g" },
};
const GTYPE = { RUNNING: "lopen", TRAIL_RUNNING: "lopen", TREADMILL_RUNNING: "lopen", INDOOR_RUNNING: "lopen", CYCLING: "fietsen", ROAD_BIKING: "fietsen",
  INDOOR_CYCLING: "fietsen", VIRTUAL_RIDE: "fietsen", MOUNTAIN_BIKING: "fietsen", GRAVEL_CYCLING: "fietsen", LAP_SWIMMING: "zwemmen",
  OPEN_WATER_SWIMMING: "zwemmen", SWIMMING: "zwemmen", STRENGTH_TRAINING: "kracht", HIKING: "wandelen", WALKING: "wandelen", SQUASH: "squash" };
const sportVanAct = (s) => GTYPE[String(s?.activityType || "").toUpperCase()] || "andere";
const sportVanPlan = (p) => p?.k === "rust" ? "rust" : (SPORT[p?.sp] ? p.sp : ({ run: "lopen", bike: "fietsen", swim: "zwemmen", kracht: "kracht" }[p?.k] || "andere"));

/* ================= gegevens ================= */
let S = { user: null, prof: null, plan: {}, note: {}, acts: [], gez: [], ana: {}, bel: null, kop: null, saxo: null, stand: null, saxoMelding: null, aiFout: null, geladen: false };
async function laad() {
  const uid = S.user.id, van = plusDag(vandaag(), -60);
  const [prof, plan, gd, an, bel, kop, sx, st] = await Promise.all([
    sb.from("profiles").select("naam").eq("id", uid).maybeSingle(),
    sb.from("plans").select("cplan,cnote").eq("athlete_id", uid).maybeSingle(),
    sb.from("garmin_data").select("kind,ref,day,data,received_at").eq("user_id", uid).gte("day", van).order("day", { ascending: false }).limit(1000),
    sb.from("analyse").select("ref,tekst,created_at").eq("user_id", uid),
    sb.from("belegger").select("antwoorden,profiel,updated_at").eq("user_id", uid).maybeSingle(),
    sb.rpc("koppelingen"),
    sb.rpc("saxo_status"),
    sb.from("saxo_stand").select("env,data,opgehaald").eq("user_id", uid).maybeSingle(),
  ]);
  S.prof = prof.data || {}; S.plan = plan.data?.cplan || {}; S.note = plan.data?.cnote || {};
  const rows = gd.data || [];
  S.acts = rows.filter((r) => r.kind === "activity").sort((a, b) => (b.data?.summary?.startTimeInSeconds || 0) - (a.data?.summary?.startTimeInSeconds || 0));
  S.gez = rows.filter((r) => r.kind !== "activity");
  S.ana = Object.fromEntries((an.data || []).map((r) => [r.ref, r]));
  S.bel = bel.data || null; S.kop = kop.data || null; S.saxo = sx.data || null; S.stand = st.data || null; S.geladen = true;
}
// gezondheid per dag
function gezDag(dag) {
  const o = {};
  for (const r of S.gez) if (r.day === dag) {
    const g = r.data || {};
    if (r.kind === "sleep") { if (g.durationInSeconds) o.slaap = g.durationInSeconds; const sc = g.overallSleepScore?.value ?? g.sleepScores?.overall?.value; if (sc != null) o.score = sc; }
    if (r.kind === "hrv" && g.lastNightAvg != null) o.hrv = g.lastNightAvg;
    if (r.kind === "daily" && g.restingHeartRateInBeatsPerMinute != null) o.rp = g.restingHeartRateInBeatsPerMinute;
    if (r.kind === "stress") { if (g.bbMax != null) o.bb = g.bbMax; }
    if (r.kind === "metrics" && g.vo2Max != null) o.vo2 = g.vo2Max;
  }
  return o;
}
function reeks(veld, n = 14) { const out = []; for (let i = n - 1; i >= 0; i--) { const d = plusDag(vandaag(), -i); out.push({ d, v: gezDag(d)[veld] ?? null }); } return out; }

/* ================= meldingen over koppelingen ================= */
function waarschuwingen() {
  const w = [], k = S.kop;
  if (!k) return w;
  if (!k.legati_link) w.push("De koppeling met Legati is nog niet ingesteld. Trainingen en Garmin-gegevens komen dan niet binnen.");
  else if (k.legati_fout) w.push("De koppeling met Legati gaf een fout (" + esc(k.legati_fout) + "). Laatste keer gelukt: " + sinds(k.legati_ok) + ".");
  else if (!k.legati_ok || Date.now() - new Date(k.legati_ok).getTime() > 2 * 3600e3) w.push("De koppeling met Legati is gestopt: laatste keer gelukt " + sinds(k.legati_ok) + ".");
  const lg = S.gez.reduce((m, r) => (r.day > m ? r.day : m), "");
  if (k.legati_ok && lg && lg < plusDag(vandaag(), -2)) w.push("Er komen geen nieuwe Garmin-gegevens meer binnen sinds " + langeDatum(lg) + ". Kijk of je horloge nog synchroniseert met Garmin Connect en of Garmin nog gekoppeld is in de Legati-app.");
  const x = S.saxo;
  if (x && x.env && x.last_error && !x.gekoppeld) w.push("De koppeling met Saxo is gestopt. Koppel opnieuw bij Beleggen.");
  else if (x && x.gekoppeld && x.last_ok && Date.now() - new Date(x.last_ok).getTime() > 2 * 3600e3) w.push("Saxo gaf geen nieuwe gegevens meer sinds " + sinds(x.last_ok) + ".");
  return w;
}
const alerts = () => waarschuwingen().map((t) => '<div class="alert a-warn"><span>⚠️</span><span>' + t + "</span></div>").join("");

/* ================= kleine bouwstenen ================= */
function planRegel(p) {
  if (!p) return null;
  const sp = sportVanPlan(p), x = SPORT[sp];
  const extra = [p.t, p.km ? (sp === "zwemmen" ? getal(p.km * 1000) + " m" : getal(p.km, 1) + " km") : ""].filter(Boolean).join(" · ");
  return { sp, x, titel: p.s || x.n, extra, z: p.z || "" };
}
function planEv(dag, p, metDatum) {
  const r = planRegel(p); if (!r) return "";
  return '<div class="ev"><div class="ic ' + r.x.c + '">' + r.x.e + '</div><div class="et"><b>' + esc(r.titel) + (r.extra ? ' <span class="mut" style="display:inline;font-weight:500">· ' + esc(r.extra) + "</span>" : "") + "</b>" +
    (metDatum ? '<span>' + esc(langeDatum(dag)) + "</span>" : "") + (r.z ? "<span>" + esc(r.z) + "</span>" : "") + "</div></div>";
}
function actSamenvatting(a) {
  const s = a.data?.summary || {}, sp = sportVanAct(s), m = Number(s.distanceInMeters || 0), v = Number(s.averageSpeedInMetersPerSecond || 0), sec = Number(s.durationInSeconds || 0);
  const bits = [];
  if (sec) bits.push(duur(sec));
  if (m >= 300 && !["squash", "kracht"].includes(sp)) bits.push(sp === "zwemmen" ? getal(m) + " m" : getal(m / 1000, 1) + " km");
  if (v > 0 && sp === "lopen") { const p = 1000 / v; bits.push(Math.floor(p / 60) + ":" + pad(Math.round(p % 60)) + " /km"); }
  if (v > 0 && sp === "fietsen") bits.push(getal(v * 3.6, 1) + " km/u");
  if (v > 0 && sp === "zwemmen") { const p = 100 / v; bits.push(Math.floor(p / 60) + ":" + pad(Math.round(p % 60)) + " /100m"); }
  if (s.averageHeartRateInBeatsPerMinute) bits.push("♥ " + s.averageHeartRateInBeatsPerMinute);
  return { s, sp, x: SPORT[sp], bits, titel: s.activityName || SPORT[sp].n };
}
function actEv(a) {
  const r = actSamenvatting(a), an = S.ana[a.ref];
  return '<button class="ev" data-go="#sport/' + esc(a.ref) + '"><div class="ic ' + r.x.c + '">' + r.x.e + '</div><div class="et"><b>' + esc(r.titel) + "</b><span>" +
    esc(korteDatum(a.day) + " · " + r.bits.join(" · ")) + "</span>" + (an ? '<span style="color:var(--acc)">Analyse klaar</span>' : "") + '</div><span class="chev">›</span></button>';
}
function spark(punten, kleur, eenheid) {
  const vals = punten.map((p) => p.v).filter((v) => v != null);

  const W = 320, H = 84, lo = Math.min(...vals), hi = Math.max(...vals), sp = hi - lo || 1, n = punten.length;
  const xy = punten.map((p, i) => p.v == null ? null : [8 + (i * (W - 16)) / (n - 1), 10 + (H - 26) * (1 - (p.v - lo) / sp)]);
  let d = "", pen = false; xy.forEach((q) => { if (!q) { pen = false; return; } d += (pen ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1); pen = true; });
  const last = [...xy].reverse().find(Boolean);
  return '<svg class="spark" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Verloop"><path d="' + d + '" fill="none" stroke="' + kleur + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
    (last ? '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="3.5" fill="' + kleur + '"/>' : "") +
    '<text x="8" y="' + (H - 2) + '" font-size="11" fill="var(--mut)">' + esc(korteDatum(punten[0].d)) + '</text><text x="' + (W - 8) + '" y="' + (H - 2) + '" font-size="11" fill="var(--mut)" text-anchor="end">laag ' + getal(lo) + " · hoog " + getal(hi) + (eenheid ? " " + eenheid : "") + "</text></svg>";
}
function hrGrafiek(a) {
  const hr = a.data?.st?.hr || [], t = a.data?.st?.t || [];
  const pts = hr.map((v, i) => ({ v: typeof v === "number" ? v : null, x: t[i] ?? i })).filter((p) => p.v != null);
  if (pts.length < 5) return "";
  const W = 320, H = 110, lo = Math.min(...pts.map((p) => p.v)) - 5, hi = Math.max(...pts.map((p) => p.v)) + 5, x0 = pts[0].x, x1 = pts[pts.length - 1].x || 1;
  const d = pts.map((p, i) => (i ? "L" : "M") + (8 + ((p.x - x0) / (x1 - x0 || 1)) * (W - 16)).toFixed(1) + " " + (8 + (H - 28) * (1 - (p.v - lo) / (hi - lo))).toFixed(1)).join("");
  return '<div class="card"><div class="ch"><h2>Hartslag</h2><span class="sm mut">' + Math.round(lo + 5) + "–" + Math.round(hi - 5) + ' bpm</span></div><svg class="spark" style="height:110px" viewBox="0 0 ' + W + " " + H + '"><path d="' + d + '" fill="none" stroke="var(--warn)" stroke-width="1.8" stroke-linejoin="round"/><text x="8" y="' + (H - 4) + '" font-size="11" fill="var(--mut)">start</text><text x="' + (W - 8) + '" y="' + (H - 4) + '" font-size="11" fill="var(--mut)" text-anchor="end">' + Math.round(x1) + ' min</text></svg></div>';
}

function berekenProfiel(a) {

/* ================= meldingen (push) ================= */
const PUSH_OK = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window && location.protocol !== "file:";
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const STANDALONE = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const u8key = (k) => { const t = k.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - (k.length % 4)) % 4), b = atob(t), o = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o; };
async function fn(naam, pad, body, method) {
  const { data: { session } } = await sb.auth.getSession();
  let r; try { r = await fetch(CFG.url + "/functions/v1/" + naam + (pad ? "/" + pad : ""), { method: method || "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + (session ? session.access_token : ""), apikey: CFG.key }, body: method === "GET" ? undefined : JSON.stringify(body || {}) }); }
  catch (e) { throw { code: "net" }; }
  const j = await r.json().catch(() => ({})); if (!r.ok) throw { code: j.error || "fout" }; return j;
}
async function meldSub() { if (!PUSH_OK()) return null; const r = await navigator.serviceWorker.getRegistration(); return r ? await r.pushManager.getSubscription() : null; }
async function meldR() {
  const box = $("meld"); if (!box) return;
  if (!PUSH_OK()) { box.innerHTML = '<p class="empty">' + (IOS && !STANDALONE() ? "Op je iPhone werken meldingen alleen vanuit het icoon op je beginscherm. Open deze pagina in Safari, tik op Deel en kies <b>Zet op beginscherm</b>. Open de app via dat icoon en kom hier terug." : "Deze browser ondersteunt geen meldingen.") + "</p>"; return; }
  if (Notification.permission === "denied") { box.innerHTML = '<p class="empty">Meldingen zijn geweigerd. Zet ze aan via Instellingen, Meldingen, AD Omniserve op je iPhone.</p>'; return; }
  const sub = await meldSub().catch(() => null);
  box.innerHTML = '<p class="empty">Je krijgt enkel een melding als er een nieuwe training binnen is, met de analyse erbij. Verder niets.</p>' +
    (sub ? '<div class="row" style="margin-top:8px"><span>Op dit toestel</span><b style="color:var(--acc)">Aan</b></div><div class="grid" style="margin-top:6px"><button class="btn btn2" data-act="mtest">Testmelding</button><button class="btn btn2" data-act="muit">Uitzetten</button></div>'
      : '<button class="btn" data-act="maan">Meldingen aanzetten</button>') + '<p class="msg" id="mmsg"></p>';
}
async function meldActie(act, knop) {
  const msg = (x) => { const m = $("mmsg"); if (m) m.textContent = x; };
  knop.disabled = true;
  try {
    if (act === "maan") {
      const perm = await Notification.requestPermission(); if (perm !== "granted") { await meldR(); return; }
      const reg = await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
      const { key } = await fn("push", "key", null, "GET");
      let sub = await reg.pushManager.getSubscription(); if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8key(key) });
      const j = sub.toJSON(); await fn("push", "subscribe", { endpoint: j.endpoint, keys: j.keys, ua: IOS ? "iPhone" : "Browser" });
      await meldR(); msg("Meldingen staan aan.");
    } else if (act === "mtest") { const j = await fn("push", "test"); msg(j.sent ? "Testmelding verstuurd." : "Er kon geen melding verstuurd worden."); knop.disabled = false; }
    else if (act === "muit") { const sub = await meldSub(); if (sub) { await fn("push", "unsubscribe", { endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); } await meldR(); }
  } catch (e) { console.error(e); knop.disabled = false; msg(e && e.code === "net" ? "Geen verbinding." : "Dat lukte niet. Probeer opnieuw."); }
}

const AIFOUT = { geen_sleutel: "De AI staat nog niet aan: de Anthropic-sleutel moet nog in Supabase gezet worden (zie Instellingen).", druk: "De AI is even druk. Probeer het zo meteen opnieuw.", limiet: "Je hebt het maximum aantal vragen voor vandaag bereikt.", net: "Geen verbinding. Controleer je internet.", geweigerd: "Daar kan de assistent niet op antwoorden." };
function openChat(vraag) {
  const el = $("sheet");

function sluitChat() { $("sheet").innerHTML = ""; document.body.style.overflow = ""; }
function tekenChat(bezig) {
  const box = $("msgs"); if (!box) return;
  box.innerHTML = (CHAT.length ? "" : '<div class="bub a">Hoi! Ik ken je Legati-schema, je Garmin-trainingen en je herstel van de laatste weken. Vraag maar raak. Beleggingen en agenda zie ik nog niet.</div>') +
    CHAT.map((m) => '<div class="bub ' + (m.role === "user" ? "u" : m.err ? "e" : "a") + '">' + esc(m.content) + "</div>").join("") + (bezig ? '<div class="bub a"><span class="spin"></span></div>' : "");

async function stuurChat(q) {
  q = String(q || "").trim().slice(0, 2000); if (!q) return;
  CHAT.push({ role: "user", content: q }); tekenChat(true);
  try {
    const msgs = CHAT.filter((m) => !m.err).map((m) => ({ role: m.role, content: m.content }));
    while (msgs.length && msgs[0].role !== "user") msgs.shift();
    const j = await fn("ai", "", { kind: "chat", messages: msgs });
    CHAT.push({ role: "assistant", content: j.text || "(geen antwoord)" }); S.aiFout = null;
  } catch (e) { const c = e && e.code; if (c === "geen_sleutel") S.aiFout = c; CHAT.push({ role: "assistant", err: true, content: AIFOUT[c] || "Er ging iets mis. Probeer opnieuw." }); }
  bewaarChat(); tekenChat();
}
